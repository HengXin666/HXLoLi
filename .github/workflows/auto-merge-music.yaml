name: "[LoLi]: 自动合并音乐版本同步 PR"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # --- Job 1: 自动审批并合并 LoLi-Bot 的音乐同步 PR ---
  auto-merge-music-pr:
    # 安全校验: 仅处理满足所有条件的 PR
    # 1. 来自 bot/sync-music-version 分支 (非 fork)
    # 2. PR 标题包含 [LoLi-Bot]
    # 3. PR 创建者是仓库所有者 (HengXin666)
    # 4. PR 来自同一仓库 (非 fork PR), 防止 pull_request_target 攻击
    if: |
      github.head_ref == 'bot/sync-music-version' &&
      contains(github.event.pull_request.title, '[LoLi-Bot]') &&
      github.event.pull_request.user.login == 'HengXin666' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 安全校验
        run: |
          echo "🔒 安全校验通过:"
          echo "  - 分支: ${{ github.head_ref }}"
          echo "  - 提交者: ${{ github.event.pull_request.user.login }}"
          echo "  - 来源仓库: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "  - 目标仓库: ${{ github.repository }}"
          echo "  - 是否为 Fork: ${{ github.event.pull_request.head.repo.fork }}"

      - name: 校验 PR 只修改了允许的文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 获取 PR 修改的文件列表
          CHANGED_FILES=$(gh pr diff "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --name-only)
          echo "📄 PR 修改的文件:"
          echo "${CHANGED_FILES}"

          # 只允许修改 data/musicVersion.ts
          ALLOWED_FILES="data/musicVersion.ts"
          while IFS= read -r file; do
            if [ -n "$file" ] && ! echo "${ALLOWED_FILES}" | grep -qF "$file"; then
              echo "❌ 发现未授权的文件修改: ${file}"
              echo "🚫 安全校验失败, 拒绝自动合并!"
              exit 1
            fi
          done <<< "${CHANGED_FILES}"
          echo "✅ 文件修改范围校验通过"

      - name: 审批并合并 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "🎵 检测到音乐版本同步 PR #${PR_NUMBER}"
          echo "📋 标题: ${{ github.event.pull_request.title }}"

          # 审批 PR
          echo "✅ 正在审批 PR..."
          gh pr review "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "🤖 LoLi-Bot 自动审批通过にゃ♪"

          # 等待一小会儿确保状态同步
          sleep 5

          # Squash 合并 PR
          echo "🔀 正在合并 PR..."
          gh pr merge "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --squash \
            --subject "[LoLi-Bot]: 🎵 同步 HXLoLi-Music 版本にゃ♪" \
            --delete-branch

          echo "🎉 PR #${PR_NUMBER} 合并成功!"

  # --- Job 2: 合并成功后触发部署 ---
  deploy-after-merge:
    needs: auto-merge-music-pr
    runs-on: ubuntu-latest
    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 安装 dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy
