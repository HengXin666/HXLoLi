name: "生产博客"
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'main'
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - name: 安装包包
        run: |
          [ -e yarn.lock ] && yarn install --frozen-lockfile || npm ci
          npm run deploy
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
      - name: 设置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}
