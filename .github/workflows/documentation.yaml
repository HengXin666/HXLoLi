name: "[LoLi]: 爬取 BanGuMi 看情况更新博客"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 对应北京时间 00:30 (16:30 UTC) 和 03:00 (19:00 UTC)
    - cron: '30 16 * * *'
    - cron: '0 19 * * *'
  # 手动触发按钮
  workflow_dispatch:
    inputs:
      update_type:
        description: '选择更新模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

jobs:
  sync-data:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '\[LoLi-Bot\]')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 启用 蟒蛇
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 蟒蛇 依赖
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 判断更新模式 (全量 vs 增量)
        run: |
          # 初始化标识
          DO_FULL_UPDATE=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：根据输入决定
            if [ "${{ github.event.inputs.update_type }}" = "full" ]; then
              DO_FULL_UPDATE=true
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # 定时触发：判断是否为北京时间周一凌晨 (0点左右)
            WEEKDAY=$(TZ=Asia/Shanghai date +%u)
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$WEEKDAY" -eq 1 ] && [ "$HOUR" -eq 0 ]; then
              DO_FULL_UPDATE=true
            fi
          fi

          if [ "$DO_FULL_UPDATE" = "true" ]; then
            echo "🚀 执行全量更新 (清理旧数据)"
            rm -f *.json
          else
            echo "⏱️ 执行增量更新"
          fi
        working-directory: ./py/anime/data

      - name: 开始爬取番剧
        run: |
          source $HOME/.cargo/env
          uv run Api.py --username="heng_xin" --token=${{ secrets.BGM_ACCESS_TOKEN }}
        working-directory: ./py/anime
        env:
          PYTHONUNBUFFERED: "1"

      - name: 召唤 萝莉小猫娘 帮忙 push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[LoLi-Bot]: ご主人さま、アニメデータを更新しましたにゃ'
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'

  deploy:
    # 简化了判断逻辑，手动触发和定时触发同样可以触发部署
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[LoLi-Bot]')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: sync-data
    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 安装 dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy
