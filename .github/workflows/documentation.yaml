name: "[LoLi]: 构建部署博客"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [cdn-updated, friend-link-updated]
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  # 同一分支/PR 新构建到来时, 自动取消正在跑的旧构建
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    if: |
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.head_ref, 'auto/') &&
       contains(github.head_ref, '-cdn-'))
    runs-on: ubuntu-latest
    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 缓存 node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 安装 dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 缓存 Docusaurus 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            docusaurus-${{ runner.os }}-

      # ===== 受保护页面流程 =====

      - name: 🔐 克隆私有仓库 (HXLoLi-imouto)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_PAGES_TOKEN }}
        run: |
          if [ -z "${PRIVATE_REPO_TOKEN}" ]; then
            echo "⚠️  未配置 PRIVATE_PAGES_TOKEN, 跳过私有页面"
            echo "SKIP_PRIVATE=true" >> $GITHUB_ENV
          else
            echo "🔑 正在克隆私有仓库 HXLoLi-imouto ..."
            git clone --depth 1 \
              "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/HengXin666/HXLoLi-imouto.git" \
              ./private-pages-repo
            echo "✅ 私有仓库 HXLoLi-imouto 克隆成功"

            # 统计文件
            DOCS_COUNT=$(find ./private-pages-repo/docs -name "*.md" -o -name "*.mdx" 2>/dev/null | wc -l)
            BLOG_COUNT=$(find ./private-pages-repo/blog -name "*.md" -o -name "*.mdx" 2>/dev/null | wc -l)
            echo "📄 发现 docs: ${DOCS_COUNT}, blog: ${BLOG_COUNT}"
            echo "SKIP_PRIVATE=false" >> $GITHUB_ENV
          fi

      - name: 🔒 混合加密私有页面 (RSA-OAEP + AES-256-GCM)
        if: env.SKIP_PRIVATE != 'true'
        env:
          HXLOLI_RSA_PUBLIC_KEY: ${{ secrets.HXLOLI_RSA_PUBLIC_KEY }}
        run: |
          if [ -z "${HXLOLI_RSA_PUBLIC_KEY}" ]; then
            echo "❌ 未配置 HXLOLI_RSA_PUBLIC_KEY, 无法加密!"
            echo "   注意: 只需要公钥! 公钥泄露也无法解密."
            echo "   生成密钥对:"
            echo "     openssl genrsa -out hxloli_private.pem 2048"
            echo "     openssl rsa -in hxloli_private.pem -pubout -out hxloli_public.pem"
            echo "   然后将 hxloli_public.pem 的内容设为 HXLOLI_RSA_PUBLIC_KEY Secret"
            exit 1
          fi

          echo "🔒 开始 RSA-OAEP + AES-256-GCM 混合加密..."
          node scripts/encrypt-private.mjs \
            --source ./private-pages-repo \
            --mode deploy \
            --docs-output ./docs \
            --blog-output ./blog
          echo "✅ 混合加密完成, 密文已嵌入占位页面"
          echo "   🔓 公钥加密 → 即使泄露也无法解密"

      - name: 📋 重新生成侧边栏 (包含私有 docs 页面)
        if: env.SKIP_PRIVATE != 'true'
        run: |
          echo "📋 重新生成侧边栏..."
          node scripts/generateSidebar.js
          echo "✅ 侧边栏已更新"

      - name: 🧹 清理私有仓库 (安全)
        if: env.SKIP_PRIVATE != 'true'
        run: |
          rm -rf ./private-pages-repo
          echo "🧹 私有仓库已清理"

      # ===== 原有构建流程 =====

      - name: 📋 打印 CDN 版本信息
        run: |
          echo "========== CDN 版本信息 =========="
          for f in data/*CdnVersion.ts; do
            if [ -f "$f" ]; then
              VERSION=$(grep -oP "=\s*'[^']+'" "$f" | sed "s/=\s*'//;s/'//")
              LAST_MODIFIED=$(TZ='Asia/Shanghai' git log -1 --format='%cd' --date=format:'%Y-%-m-%-d %H:%M:%S' -- "$f")
              echo "📦 $f"
              echo "   版本号: ${VERSION}"
              echo "   最近更新 (北京时间): ${LAST_MODIFIED}"
            fi
          done
          echo "=================================="

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 为 GitHub Pages 构建
        run: npm run build

      - name: 📦 安装 ffmpeg (用于压缩超大 GIF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
          ffmpeg -version | head -1

      - name: 🗜️ 优化 GitHub Pages 超大 GIF
        timeout-minutes: 8
        run: node scripts/optimize-large-assets.mjs --build-dir ./build --max-size 25 --only-gif --rewrite-references --gif-timeout 180

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy -- --skip-build

      - name: 为 Cloudflare Workers 重新构建 (baseUrl=/)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare

      - name: 拆分搜索索引 (Cloudflare Workers 单文件 ≤25MB)
        run: node scripts/split-search-index.mjs --max-size 20 --build-dir ./build --delete-source

      - name: 🗜️ 优化 Cloudflare Workers 超大静态资源
        timeout-minutes: 10
        run: node scripts/optimize-large-assets.mjs --build-dir ./build --max-size 25 --rewrite-references --remove-unsupported --remove-remaining --gif-timeout 180 --image-timeout 120

      # wrangler.toml / worker.js 改为仓库内维护 (项目根目录), 不再用 heredoc 生成。
      # 原因: workflow 里 heredoc 的收尾标记带缩进时, shell 会把缩进原样写进文件,
      # 破坏脚本结构; 且旧配置的 [assets] 缺少 binding = "ASSETS", 导致
      # env.ASSETS 为 undefined → 线上表现为 Cloudflare Error 1101。
      - name: 校验 Cloudflare Workers 部署配置
        run: |
          echo "===== wrangler.toml ====="
          cat wrangler.toml
          echo "===== worker.js 语法检查 ====="
          node --check worker.js
          node scripts/check-cf-worker-config.mjs

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
