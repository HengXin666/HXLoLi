name: Node.js CI & Bangumi Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1 (原 Job 2): 同步 Bangumi 数据
  # 这个 job 现在是所有其他 job 的起点
  sync-data:
    # 关键: 只有在 push 到 main 分支, 且提交信息不包含 [LoLi-Bot] 时才运行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest

    steps:
      - name: 启用 git push 能力
        uses: actions/checkout@v4
        # 需要 fetch-depth: 0 才能 push
        with:
          fetch-depth: 0

      - name: 启用 蟒蛇
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 蟒蛇 依赖
        # 在 py 目录下运行 uv sync。它会自动寻找 requirements.txt 或 pyproject.toml
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 开始爬取番剧
        run: |
          source $HOME/.cargo/env
          uv run Api.py --username="heng_xin" --token=${{ secrets.BGM_ACCESS_TOKEN }}
        working-directory: ./py/anime

      - name: 拷贝数据到静态网站目录
        run: |
          source $HOME/.cargo/env
          uv run CopyToStaticWebPath.py
        working-directory: ./py/anime

      - name: 提交数据到 main 分支
        run: |
          git config --global user.name "LoLi-Bot"
          git config --global user.email "loli-bot@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            echo "发现数据变更, 正在提交..."
            git add .
            git commit -m "[LoLi-Bot]: 同步番剧信息"
            git push
          else
            echo "数据无变更, 无需提交。"
          fi

  # Job 2 (原 Job 1): 运行构建测试
  checks:
    # 关键: 依赖于 sync-data 的成功完成
    needs: sync-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 构建静态博客
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi
          npm run build

  # Job 3: 部署到 GitHub Pages
  deploy:
    # 关键: 也依赖于 sync-data 的成功完成
    # 并且, 只在 push 到 main 且不是机器人提交时运行 (这个条件从 sync-data 继承, 但再次声明更清晰)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest
    needs: sync-data

    steps:
      - name: Checkout repository
        # 在 sync-data 推送新 commit 后, 我们需要重新 checkout 最新的代码
        uses: actions/checkout@v4
        with:
            ref: 'main' # 明确指定 checkout main 分支的最新 commit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Set up SSH for deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: Deploy to GitHub Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy
