name: "[LoLi]: 构建部署博客"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 缓存 node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: 安装 dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 缓存 Docusaurus 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            docusaurus-${{ runner.os }}-

      # ===== 受保护页面流程 =====

      - name: 🔐 克隆私有仓库 (HXLoLi-imouto)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_PAGES_TOKEN }}
        run: |
          if [ -z "${PRIVATE_REPO_TOKEN}" ]; then
            echo "⚠️  未配置 PRIVATE_PAGES_TOKEN, 跳过私有页面"
            echo "SKIP_PRIVATE=true" >> $GITHUB_ENV
          else
            echo "🔑 正在克隆私有仓库 HXLoLi-imouto ..."
            git clone --depth 1 \
              "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/HengXin666/HXLoLi-imouto.git" \
              ./private-pages-repo
            echo "✅ 私有仓库 HXLoLi-imouto 克隆成功"

            # 统计文件
            DOCS_COUNT=$(find ./private-pages-repo/docs -name "*.md" -o -name "*.mdx" 2>/dev/null | wc -l)
            BLOG_COUNT=$(find ./private-pages-repo/blog -name "*.md" -o -name "*.mdx" 2>/dev/null | wc -l)
            echo "📄 发现 docs: ${DOCS_COUNT}, blog: ${BLOG_COUNT}"
            echo "SKIP_PRIVATE=false" >> $GITHUB_ENV
          fi

      - name: 🔒 混合加密私有页面 (RSA-OAEP + AES-256-GCM)
        if: env.SKIP_PRIVATE != 'true'
        env:
          HXLOLI_RSA_PUBLIC_KEY: ${{ secrets.HXLOLI_RSA_PUBLIC_KEY }}
        run: |
          if [ -z "${HXLOLI_RSA_PUBLIC_KEY}" ]; then
            echo "❌ 未配置 HXLOLI_RSA_PUBLIC_KEY, 无法加密!"
            echo "   注意: 只需要公钥! 公钥泄露也无法解密."
            echo "   生成密钥对:"
            echo "     openssl genrsa -out hxloli_private.pem 2048"
            echo "     openssl rsa -in hxloli_private.pem -pubout -out hxloli_public.pem"
            echo "   然后将 hxloli_public.pem 的内容设为 HXLOLI_RSA_PUBLIC_KEY Secret"
            exit 1
          fi

          echo "🔒 开始 RSA-OAEP + AES-256-GCM 混合加密..."
          node scripts/encrypt-private.mjs \
            --source ./private-pages-repo \
            --mode deploy \
            --docs-output ./docs \
            --blog-output ./blog
          echo "✅ 混合加密完成, 密文已嵌入占位页面"
          echo "   🔓 公钥加密 → 即使泄露也无法解密"

      - name: 📋 重新生成侧边栏 (包含私有 docs 页面)
        if: env.SKIP_PRIVATE != 'true'
        run: |
          echo "📋 重新生成侧边栏..."
          node scripts/generateSidebar.js
          echo "✅ 侧边栏已更新"

      - name: 🧹 清理私有仓库 (安全)
        if: env.SKIP_PRIVATE != 'true'
        run: |
          rm -rf ./private-pages-repo
          echo "🧹 私有仓库已清理"

      # ===== 原有构建流程 =====

      - name: 📋 打印 CDN 版本信息
        run: |
          echo "========== CDN 版本信息 =========="
          for f in data/*CdnVersion.ts; do
            if [ -f "$f" ]; then
              VERSION=$(grep -oP "=\s*'[^']+'" "$f" | sed "s/=\s*'//;s/'//")
              LAST_MODIFIED=$(TZ='Asia/Shanghai' git log -1 --format='%cd' --date=format:'%Y-%-m-%-d %H:%M:%S' -- "$f")
              echo "📦 $f"
              echo "   版本号: ${VERSION}"
              echo "   最近更新 (北京时间): ${LAST_MODIFIED}"
            fi
          done
          echo "=================================="

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy

      - name: 为 Cloudflare Workers 重新构建 (baseUrl=/)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare

      - name: 拆分搜索索引 (Cloudflare Workers 单文件 ≤25MB)
        run: node scripts/split-search-index.mjs --max-size 20 --build-dir ./build

      - name: 📦 安装 ffmpeg (用于压缩超大 GIF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
          ffmpeg -version | head -1

      - name: 🗜️ 压缩超过 25MB 的静态资源 (Cloudflare 单文件限制)
        run: |
          echo "🔍 扫描超过 25MB 的文件..."
          OVERSIZED=$(find ./build -type f -size +25M)
          if [ -z "$OVERSIZED" ]; then
            echo "✅ 没有超限文件"
            exit 0
          fi
          echo "$OVERSIZED" | while read -r file; do
            SIZE=$(du -h "$file" | cut -f1)
            EXT="${file##*.}"
            EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            if [ "$EXT_LOWER" = "gif" ]; then
              WEBP="${file%.${EXT}}.webp"
              echo "�️ 转换 GIF → WebP: $file ($SIZE)"
              ffmpeg -i "$file" -vcodec libwebp -lossless 0 -q:v 75 -loop 0 \
                -an -vsync 0 "$WEBP" -y 2>/dev/null
              if [ -f "$WEBP" ]; then
                NEW_SIZE=$(du -h "$WEBP" | cut -f1)
                echo "   ✅ 转换成功: $WEBP ($NEW_SIZE)"
                rm -f "$file"
              else
                echo "   ❌ 转换失败, 移除原文件"
                rm -f "$file"
              fi
            elif echo "$EXT_LOWER" | grep -qE "^(png|jpg|jpeg)$"; then
              echo "🗜️ 压缩图片: $file ($SIZE)"
              convert "$file" -quality 80 -resize '4096x4096>' "$file" 2>/dev/null
              NEW_SIZE=$(du -h "$file" | cut -f1)
              NEW_BYTES=$(stat -c%s "$file")
              if [ "$NEW_BYTES" -gt 26214400 ]; then
                echo "   ⚠️ 压缩后仍超限 ($NEW_SIZE), 移除"
                rm -f "$file"
              else
                echo "   ✅ 压缩后: $NEW_SIZE"
              fi
            else
              echo "🗑️ 无法压缩, 移除: $file ($SIZE)"
              rm -f "$file"
            fi
          done
          echo "🔍 兜底检查: 确保没有残留超限文件..."
          REMAINING=$(find ./build -type f -size +25M)
          if [ -n "$REMAINING" ]; then
            echo "⚠️ 仍有超限文件, 强制删除:"
            echo "$REMAINING" | while read -r f; do
              echo "   🗑️ 删除: $f ($(du -h "$f" | cut -f1))"
              rm -f "$f"
            done
          fi
          echo "✅ 超限文件处理完成"

      - name: 生成 wrangler.toml 和 worker.js
        run: |
          cat > wrangler.toml << 'EOF'
          name = "hxloli"
          main = "./worker.js"
          compatibility_date = "2024-09-23"

          [assets]
          directory = "./build"
          EOF

          cat > worker.js << 'WORKEREOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);

              // 拦截 search-index.json 请求, 从 chunk 文件合并返回
              if (url.pathname === '/search-index.json' || url.pathname.match(/^\/search-index(-[a-z0-9]+)?\.json$/)) {
                const manifestUrl = new URL('/search-index-manifest.json', url.origin);
                const manifestResp = await env.ASSETS.fetch(manifestUrl);
                if (!manifestResp.ok) {
                  return env.ASSETS.fetch(request);
                }
                const manifest = await manifestResp.json();
                const parts = [];
                for (const chunk of manifest.chunks) {
                  const chunkUrl = new URL('/' + chunk, url.origin);
                  const chunkResp = await env.ASSETS.fetch(chunkUrl);
                  if (!chunkResp.ok) {
                    return new Response('Search index chunk not found: ' + chunk, { status: 500 });
                  }
                  parts.push(await chunkResp.text());
                }
                return new Response(parts.join(''), {
                  headers: {
                    'Content-Type': 'application/json',
                    'Cache-Control': 'public, max-age=604800, immutable',
                  },
                });
              }

              // GIF → WebP 回退: 超大 GIF 在构建时被转为 WebP
              const resp = await env.ASSETS.fetch(request);
              if (resp.status === 404 && url.pathname.endsWith('.gif')) {
                const webpUrl = new URL(url.pathname.replace(/\.gif$/i, '.webp'), url.origin);
                const webpResp = await env.ASSETS.fetch(new Request(webpUrl, request));
                if (webpResp.ok) return webpResp;
              }
              return resp;
            },
          };
          WORKEREOF

          echo "✅ wrangler.toml 和 worker.js 已生成"

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
