name: "[LoLi]: 构建部署博客"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 部署 ---
  deploy:
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 安装 dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 📋 打印 CDN 版本信息
        run: |
          echo "========== CDN 版本信息 =========="
          for f in data/*CdnVersion.ts; do
            if [ -f "$f" ]; then
              VERSION=$(grep -oP "=\s*'[^']+'" "$f" | sed "s/=\s*'//;s/'//")
              LAST_MODIFIED=$(TZ='Asia/Shanghai' git log -1 --format='%cd' --date=format:'%Y-%-m-%-d %H:%M:%S' -- "$f")
              echo "📦 $f"
              echo "   版本号: ${VERSION}"
              echo "   最近更新 (北京时间): ${LAST_MODIFIED}"
            fi
          done
          echo "=================================="

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy

      - name: 为 Cloudflare Pages 重新构建 (baseUrl=/)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare

      - name: 移除超过 25MB 的文件 (Cloudflare Pages 限制)
        run: find build -type f -size +25M -print -delete

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=hxloli --commit-dirty=true
