name: "[LoLi]: 自动化博客更新主控"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 16 * * *' # 北京时间 00:30
    - cron: '0 19 * * *'  # 北京时间 03:00
  workflow_dispatch:
    inputs:
      update_type:
        description: '选择更新模式'
        required: true
        default: 'incremental'
        type: choice
        options: [incremental, full]

jobs:
  # 脚本 1: 同步数据
  sync:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[LoLi-Bot]')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync_data.yaml
    with:
      update_type: ${{ github.event.inputs.update_type || 'incremental' }}
    secrets: inherit

  # 脚本 2: 处理 Commit (仅在数据有更新时执行)
  commit-log:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/process_commit.yaml
    secrets: inherit

  # 脚本 3: 部署 (手动触发直接执行, 或者在同步成功后执行)
  deploy:
    needs: [sync, commit-log]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.sync.outputs.changed == 'true')
    uses: ./.github/workflows/deploy_blog.yaml
    secrets: inherit
