name: Node.js CI & Bangumi Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: 同步 Bangumi 数据
  sync-data:
    # 关键: 只有在 push 到 main 分支, 且提交信息不包含 [LoLi-Bot] 时才运行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest

    steps:
      - name: 启用 git push 能力
        uses: actions/checkout@v4
        # 需要 fetch-depth: 0 才能 push
        with:
          fetch-depth: 0

      - name: 启用 蟒蛇
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 蟒蛇 依赖
        # 在 py 目录下运行 uv sync。它会自动寻找 requirements.txt 或 pyproject.toml
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 开始爬取番剧
        run: |
          source $HOME/.cargo/env
          uv run Api.py --username="heng_xin" --token=${{ secrets.BGM_ACCESS_TOKEN }}
        working-directory: ./py/anime

      - name: 拷贝数据到静态网站目录
        run: |
          source $HOME/.cargo/env
          uv run CopyToStaticWebPath.py
        working-directory: ./py/anime

      - name: 召唤 萝莉小猫娘 帮忙 push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 使用您的机器人名称作为提交信息
          commit_message: '[LoLi-Bot]: ご主人さま、アニメデータを更新しましたにゃ'
          # 设置为您指定的 Git 用户身份
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'

  # Job 2: 部署到 GitHub Pages
  deploy:
    # 关键: 也依赖于 sync-data 的成功完成
    # 并且, 只在 push 到 main 且不是机器人提交时运行 (这个条件从 sync-data 继承, 但再次声明更清晰)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest
    needs: sync-data

    steps:
      - name: 同步最新代码
        # 在 sync-data 推送新 commit 后, 我们需要重新 checkout 最新的代码
        uses: actions/checkout@v4
        with:
            ref: 'main' # 明确指定 checkout main 分支的最新 commit

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 安装 dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy
