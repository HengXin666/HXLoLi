name: "[LoLi]: 爬取 BanGuMi 看情况更新博客"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 北京时间 00:30 和 03:00
    - cron: '30 16 * * *'
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  sync-data:
    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !contains(github.event.head_commit.message, '[LoLi-Bot]'))
      ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 启用 蟒蛇
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 蟒蛇 依赖
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 判断是否需要全量更新(仅周一 00:30 CST)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TZ=Asia/Shanghai
            WEEKDAY=$(date +%u)
            HOUR=$(date +%H)
            MINUTE=$(date +%M)

            if [ "$WEEKDAY" -eq 1 ] && [ "$HOUR" -eq 0 ] && [ "$MINUTE" -eq 30 ]; then
              echo "周一 00:30(北京时间), 执行全量更新"
              rm -f *.json
            else
              echo "定时触发, 但不是周一 00:30, 增量更新"
            fi
          else
            echo "非定时触发, 增量更新"
          fi
        working-directory: ./py/anime/data

      - name: 开始爬取番剧
        run: |
          source $HOME/.cargo/env
          uv run Api.py --username="heng_xin" --token=${{ secrets.BGM_ACCESS_TOKEN }}
        working-directory: ./py/anime
        env:
          PYTHONUNBUFFERED: "1"

      - name: 拷贝数据到静态网站目录
        run: |
          source $HOME/.cargo/env
          uv run CopyToStaticWebPath.py
        working-directory: ./py/anime

      - name: 召唤 萝莉小猫娘 帮忙 push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[LoLi-Bot]: ご主人さま、アニメデータを更新しましたにゃ'
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'

  deploy:
    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest
    needs: sync-data

    steps:
      - name: 同步最新代码
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: 启动 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 安装 dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: 为工作流启用 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - name: 部署到 Github Pages
        env:
          USE_SSH: true
          GIT_USER: Heng_Xin
        run: |
          git config --global user.email "282000500@qq.com"
          git config --global user.name "Heng_Xin"
          npm run deploy
