name: 🔗 友链 PR 验证

on:
  pull_request:
    paths:
      - 'data/friendLinks.ts'

# 确保同一 PR 只有最新的一次运行
concurrency:
  group: friend-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── 自动验证 ───
  validate:
    name: 🔍 自动验证友链数据
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于 diff

      - name: 📦 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔍 运行友链验证
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-friend-links.mjs

      - name: 💬 验证失败 - 评论 PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 友链验证失败\n\n请查看 [CI 日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 修正以下问题后重新提交。\n\n常见问题：\n- 只允许修改 \`data/friendLinks.ts\` 文件\n- \`github\` 字段必须与你的 GitHub 用户名一致\n- 所有链接必须可正常访问 (HTTP 200)\n- 不能删除或修改他人的友链\n- 描述不超过 50 字`
            })

      - name: ✅ 验证通过 - 评论 PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ 友链验证通过\n\n所有自动检查已通过，等待仓库维护者人工审核后合入。 ✨`
            })

  # ─── 人工审核 ───
  manual-review:
    name: 👀 人工审核
    needs: validate
    runs-on: ubuntu-latest
    environment: friend-link-review  # 需要在 GitHub 仓库设置中创建此环境并配置审核人
    steps:
      - name: ✅ 审核通过
        run: echo "人工审核已通过，PR 可以合入 ✨"
