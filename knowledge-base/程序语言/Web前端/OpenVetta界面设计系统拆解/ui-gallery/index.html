<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    background: rgb(20,22,30); color: rgb(220,224,234);
    font: 13px/1.6 -apple-system, "SF Pro Text", "Noto Sans SC", sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; flex: none;
           border-bottom: 1px solid rgb(42,45,56); }
  header b { font-size: 13px; font-weight: 600; }
  header span { color: rgb(138,144,160); font-size: 12px; }
  header .sp { flex: 1; }
  main { flex: 1; min-height: 0; display: flex; }
  nav { width: 190px; flex: none; overflow-y: auto; padding: 8px 6px; border-right: 1px solid rgb(42,45,56); }
  nav h4 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; color: rgb(138,144,160); }
  nav button { display: block; width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 1px;
               border: 0; border-radius: 6px; background: transparent; color: inherit;
               font: inherit; cursor: pointer; transition: background-color .15s; }
  nav button:hover { background: rgb(41,41,43); }
  nav button[aria-current="true"] { background: color-mix(in srgb, rgb(99,102,241) 14%, transparent);
                                    color: rgb(160,163,255); }
  figure { flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; justify-content: center;
           padding: 16px; position: relative; }
  figure img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px;
               border: 1px solid rgb(42,45,56); }
  figcaption { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: rgb(138,144,160);
               background: color-mix(in srgb, rgb(20,22,30) 80%, transparent); padding: 3px 8px; border-radius: 6px; }
  .hint { position: absolute; right: 16px; bottom: 12px; font-size: 11px; color: rgb(90,95,110); }
</style>

let cur = 0;
const nav = document.getElementById("nav");
const shot = document.getElementById("shot");
const cap = document.getElementById("cap");
const counter = document.getElementById("counter");

// 按分组渲染侧栏, 顺序与采集时一致
const groups = [];
for (const it of ITEMS) {
  let g = groups.find((x) => x.name === it.group);
  if (!g) { g = { name: it.group, items: [] }; groups.push(g); }
  g.items.push(it);
}
let idx = 0;
for (const g of groups) {
  const h = document.createElement("h4");
  h.textContent = g.name;
  nav.appendChild(h);
  for (const it of g.items) {
    const b = document.createElement("button");
    b.textContent = it.label;
    const my = idx++;
    b.onclick = () => show(my);
    b.dataset.idx = String(my);
    nav.appendChild(b);
  }
}

function show(i) {
  cur = (i + ITEMS.length) % ITEMS.length;
  const it = ITEMS[cur];
  shot.src = it.uri;
  cap.textContent = it.group + " / " + it.label;
  counter.textContent = (cur + 1) + " / " + ITEMS.length;
  for (const b of nav.querySelectorAll("button")) {
    b.setAttribute("aria-current", b.dataset.idx === String(cur) ? "true" : "false");
  }
}

addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); show(cur + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); show(cur - 1); }
});

show(0);
</script>
