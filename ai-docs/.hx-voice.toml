# HXLoLi 表达语料库 (可增长)
#
# 这是 hx-docs-voice 的长期记忆。写作前先 `hx_voice.py samples` 读一遍,
# 盲审发现新表达后用 `hx_voice.py learn` 追加  否则每次盲审的经验都白丢。
#
# [[good]] 只收**作者本人写过的原句** (出处必填), 不收想象出来的"好句子"。
# [[bad]]  带 pattern 时会被 lint 当成额外的 E 级规则, 不带 pattern 只作提醒。
#
# 点开头文件不会被 Docusaurus / sidebar 脚本 / tag 索引 / quality-gate 收录。
schema_version = 1

# =====================  值得模仿 (全部来自作者手写正文)  =====================

[[good]]
text = "因为最近要写简历, 但是之前用那个破平台, 写的有水印. 而且不好用. 还有那个数量限制. 所以决定自己做一个."
why = "动机写成一串具体不满, 一句一段; 没有一个抽象名词"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "我这里就用最简单的, 直接记录操作日志 (比如xx时间删除了xx消息id, 然后存入数据库的一个操作日志表中)"
why = "先给方案再用括号补细节, 不铺垫不升华"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "一不小心 (说是不是故意的?) 就写了 悬挂引用了... 然后出现八嘎了"
why = "自嘲 + 括号插话 + 省略号, 这是作者的节奏"
source = "blog/2025/06/21/01-八嘎日志-悬挂引用.md"

[[good]]
text = "不过爬取有点拉胯, 有的大部分爬取接口都不能用. 而且图片质量参差不齐. 但是还是可以用的."
why = "承认缺点而不道歉, 也不强行收束到正面结论"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "那么是否可以通用的? 提供一个库帮我们完成上述操作呢? 不就是白嫖免费云存储吗?"
why = "设问是为了推进下一步动作, 不是为了当漂亮开场"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "感觉不错, 反正也算是一种推荐. 感觉有意思就再看一次就完事了~"
why = "结尾戛然而止, 用 `~` 收口, 不做展望不做总结"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "所以顺便还能学习到 `倒排索引` 的使用喵~"
why = "技术名词用行内代码标出, 语气词收尾"
source = "blog/2026/05/07/01_最近的项目.md"

[[good]]
text = "没有测试过更低的, 支持 C++20 的编译器."
why = "边界说明只写事实, 不加免责套话"
source = "docs/008-开源项目/001-HXLibs/001-简介/index.md"

# =====================  必须避免 (全部来自本仓库 AI 生成正文)  ===============

[[bad]]
text = "没有 harness 的模型像脱缰的野马能力很强, 但没法可靠把你送到目的地."
why = "比喻 + 破折号 + 对仇转折, 三个 AI 指纹叠在一句里"
source = "ai-docs/002-AI/002-Agent架构/001-AI-Agent设计原理与工程实践/index.md"

[[bad]]
text = "Turnstile 不是\"更现代的验证码\", 而是一个风险控制组件"
why = "先否定一个没人主张过的 X, 再给出 Y. 直接说它是什么即可"
source = "ai-docs/002-AI/008-AI逆向/004-Turnstile防御面分析与误判权衡/index.md"

[[bad]]
text = "它值得被单独拆解的三个理由:"
why = "凑数排比. 这句在两篇不同笔记里逐字重复, 说明它是模板不是判断"
pattern = "值得被(?:单独)?(?:拆解|讨论|记录)的[一二三四五两]个"
source = "ai-docs/002-AI/002-Agent架构/"

[[bad]]
text = "个人判断: ... 我倾向于认为, 接下来真正拉开差距的不是..."
why = "仪式化结尾. 每篇都这样收束 = 没有一篇真的在表达判断"
pattern = "我倾向于认为|个人判断[::]"
source = "ai-docs/002-AI/008-AI逆向/004-Turnstile防御面分析与误判权衡/index.md"

[[bad]]
text = "更反直觉的是: 决定一次运行的并不是上一条评论"
why = "\"更反直觉的是\" 是硬造惊讶感的过渡句"
pattern = "更(?:反直觉|有意思|值得注意)的是"
source = "ai-docs/002-AI/006-多智能体/001-Multica-agent协作与上下文机制/index.md"

[[bad]]
text = "所以选电脑包时真正需要先问的不是「哪款最值」, 而是:"
why = "连买包都套这个句式, 证明它已经是无意识的口癖"
source = "ai-docs/004-生活/001-电脑包选购指标/index.md"

[[bad]]
text = "浏览器验证的本质, 早就不只是\"点没点按钮\", 而是对环境、输入、上下文和状态变化的综合判断."
why = "\"...的本质\" + 四项并列, 说了一句等于没说的话"
pattern = "的本质[,，]\\s*(?:早就)?不"
source = "ai-docs/002-AI/008-AI逆向/002-真实浏览器扩展的验证机制拆解/index.md"

[[bad]]
text = "在快速变化的行业格局中, 这一突破性功能凸显了其重要地位"
why = "意义膨胀: 把普通改动说成里程碑"
pattern = "行业格局|时代背景下|突破性(?:功能|进展)"

[[bad]]
text = "业界存在争议"
why = "含糊权威. 有名字就点名字, 没有就别写"
pattern = "业界(?:存在|普遍|公认)|专家(?:认为|指出)|有研究(?:表明|显示)"

[[bad]]
text = "这笔账真正的意义不在\"更快\", 而在..."
why = "不是X而是Y 的变体, 静态正则漏掉了 不在/而在 这一对. 同时是意义膨胀: 上文刚说差距看不出来, 下句就拔高成真正的意义"
pattern = "真正的(?:意义|价值|问题|难点)(?:不在|不是)|(?:意义|价值)(?:并)?不在[^,，。.]{0,20}而在"
source = "盲审第1轮 index.md:23"

[[bad]]
text = "std::coroutine_handle 干三件事: A、B、C. 第二件事是最有意思的那件"
why = "干N件事 + 三项排比 + 自我导览句, 模型先摊清单再挑重点的固定动作"
pattern = "(?:干|做|管|负责)(?:了)?[三四五六七]件事|第[一二三四五]件事(?:是|最)"
source = "盲审第1轮 index.md:124"

[[bad]]
text = "这篇里的机制描述与实测线程 id 是本文的全部依据"
why = "审计式免责表述, 参考文献条目里不会给自己做完备性声明"
pattern = "是本文的(?:全部)?依据|本文(?:全部|所有)(?:内容|结论|论断)"
source = "盲审第1轮 index.md:184"

[[bad]]
text = "最容易搞混的是前两个"
why = "元话语式难度评级: 宣布这里有坑却不给可判定的判据"
pattern = "最容易(?:搞混|混淆|出错)的是"
source = "盲审第1轮 003-MCP架构概述"

[[bad]]
text = "谁管得住这三件事, 谁的工具列表就不用每次重拉"
why = "对仗式金句收束: 三项排比加格言, 是空洞收尾的教科书形态"
source = "盲审第1轮 003-MCP架构概述"

[[good]]
text = "哎，长这个样子"
why = "省略主语的指认句; 书面语会写成\"它的形状如下\""
source = "渡劫C++协程 第7讲 ASR 转写"

[[good]]
text = "注意啊，这个箭头很有意思，很魔性"
why = "先给态度再给事实; 把抽象符号说成\"有意思\""
source = "渡劫C++协程 第7讲 ASR 转写"

[[good]]
text = "从 channel 出来，这不就是读嘛"
why = "把抽象规则翻成动作描述, 而不是定义"
source = "渡劫C++协程 第7讲 ASR 转写"

[[good]]
text = "其实没那么难，对吧"
why = "短句 + 反问他; 29 字以下才是口播的正常长度"
source = "渡劫C++协程 第7讲 ASR 转写"

[[good]]
text = "那肯定是不行的"
why = "断言短到 7 个字; 书面语会补成\"这种做法在实践中不可行\""
source = "渡劫C++协程 第7讲 ASR 转写"

[[bad]]
text = "真正缺的不是词表, 是没有情绪要表达"
why = "「不是X, 是Y」的变体, 前面挂「真正」把结论抬高一层; 盲审第1轮 9 处同构对举就是这个模板"
pattern = "真正(?:缺|扎眼|重要|关键|难)的(?:不|在)"
source = "盲审第1轮 003-怎么判断自己写的东西有没有AI味"

[[bad]]
text = "**怎么查**: 通篇搜一遍「我」"
why = "六节全部用同一个加粗起手做收尾: 段落模板被整篇套用, 位置和句式都固定"
source = "盲审第1轮 003-怎么判断自己写的东西有没有AI味"

[[meme]]
text = "已经没有人类了"
why = "看到一堆机器产出、没有人在场的场景"
source = "作者 2026-09-26 对话"

[[good]]
text = "UI 是工具, 不是 showroom。hover 只反馈, 不表演。"
why = "一句话立规矩, 后半句是同义重述而不是解释, 读一遍就记住, 不需要读者回头"
source = "open-vetta DESIGN.md §5.1"

[[good]]
text = "任何与本文件冲突的现存代码 = 待清理的债, 不要当作范例复制。"
why = "把'规范 vs 存量'的关系一次说死, 堵掉后来者'照抄现有代码'这条路, 是规范能活下来的前提"
source = "open-vetta DESIGN.md 开头"

[[good]]
text = "相位 0 的外观必须就是正常外观。"
why = "把'优雅降级'翻译成一句可执行的验收条件, 不写'要考虑到降级场景'这种正确的废话"
source = "open-vetta live-animations.ts"

[[bad]]
text = "这是整套观感里最关键的一条, 也是最容易抄漏的一条"
why = "「最X也最Y」双重强调叠加, 不追加信息只拧大音量, 是小节开场的固定铺垫"
source = "open-vetta-ui index.md L51"

[[bad]]
text = "真正值得抄的不是那套靛紫配色"
why = "「真正值得X的不是Y」开篇立论模板: 先否定一个读者没主张过的判断, 用句式表演洞察, 与后面的实证无关"
source = "open-vetta-ui index.md L17"

[[bad]]
text = "设计系统的分水岭不在于配色有多少, 而在于有没有一条让颜色只有一个来源的桥"
why = "一句踩三个判据: 「分水岭」意义膨胀 + 「不在于A而在于B」对仗模板 + 末尾用「桥」作隐喻收束"
source = "open-vetta-ui index.md L186"

[[bad]]
text = "这种细节决定列表看起来是「手写的」还是「渲染的」"
why = "引号式金句收尾: 每小节末都落一句判词会形成均匀的收束节奏, 单看每句都漂亮因而难自查"
source = "open-vetta-ui index.md L173"

[[bad]]
text = "有三件事直接决定「看起来像不像原生客户端」"
why = "「有N件事直接决定X」的总起预告: 技术清单本身没问题, 问题是先报总数再逐条报数, 那个预告句纯属空转"
source = "open-vetta-ui index.md L177"

[[bad]]
text = "真正的分野在于"
why = "把可枚举的事实抬成'分野'级大判断, 是模型做段落切换时的造势包装"
pattern = "真正的(?:分野|关键|核心|区别)在于"

[[bad]]
text = "实测给出两个答案"
why = "无主体化: 是'我'在测, 却让'实测'当施事者"
pattern = "实测(?:给出|表明|显示|说明)"

[[bad]]
text = "真正的价值不在X, 而在Y"
why = "not-but 的变体: 不在/而在 这一对, 静态正则漏掉"
pattern = "不在[^。]{0,20}, 而在"

[[bad]]
text = "检查动作:"
why = "名词标签式起手, 与'怎么查:'同类, 静态正则易漏; 整篇同位置套用即成段落模板"
pattern = "(判定|验证|检查)(动作|方法)[:：]"

[[bad]]
text = "把这件事的分量称了出来"
why = "隐喻动词称量, 把可数的东西说虚"
pattern = "把[^,，。]{0,12}(分量|重量)称了出来"

[[bad]]
text = "先说一个反直觉的实测结果"
why = "钩子词开场; 同一'先立直觉再推翻'骨架若在全篇复用多次即为模板"
pattern = "反直觉"

[[bad]]
text = "缺前者会显得平均, 缺后者会让长句爆掉"
why = "对偶金句落点: 两分句主语结构严格对仗并以对称负面结果收束; 每节末尾都安一句即成模板"
pattern = "缺[^。]{0,8}会[^。]{0,10}, 缺[^。]{0,8}会"
