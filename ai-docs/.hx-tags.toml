# 常用命令:
#   scan                        看统计与待合并候选
#   merge "记忆架构" --into "记忆系统"   固化一次合并
#   suggest "新词"                新词该归到哪个已有 tag
#   check                       校验全库 tag 是否规范
#   check --health              看健康度 (desc 覆盖率 / 孤儿 / 粒度过细)
