# 用途: 沉淀笔记时从这里**选** tag, 而不是每次现编近义词。
# curated 层 (本区块) 由人类维护: desc 写这个 tag 管什么, aliases 写要合并进来的近义词。
# generated 区块由 `uv run .agents/skills/hx-docs-layout/scripts/hxloli_tags.py generate` 重建, 不要手改。
