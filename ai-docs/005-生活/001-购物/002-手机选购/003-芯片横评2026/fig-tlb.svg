"nd"><rect rx="8" ry="8" x="420" y="116" width="29" height="34" class="box "/><text x="434.5" y="138.0" text-anchor="middle" class="">4K</text></g><g class="nd"><rect rx="8" ry="8" x="451" y="116" width="29" height="34" class="box "/><text x="465.5" y="138.0" text-anchor="middle" class="">4K</text></g><g class="nd"><rect rx="8" ry="8" x="482" y="116" width="29" height="34" class="box "/><text x="496.5" y="138.0" text-anchor="middle" class="">4K</text></g><g class="nd"><rect rx="8" ry="8" x="513" y="116" width="29" height="34" class="box "/><text x="527.5" y="138.0" text-anchor="middle" class="">4K</text></g></g><g class="labels"><text x="16" y="44" class="h" text-anchor="start">8 Elite Gen 5 中核</text><text x="16" y="64" class="s" text-anchor="start">一项 16KB = 4 个 4KB 页</text><text x="16" y="172" class="s" text-anchor="start">4 页物理上也连续才能合进一项</text><text x="16" y="192" class="s" text-anchor="start">前后两个 16KB 各归一组, 各有标签</text><text x="296" y="44" class="h" text-anchor="start">8 Elite Extreme Gen 6 中核</text><text x="296" y="64" class="s" text-anchor="start">一项 32KB = 前后两个 16KB 半块</text><text x="296" y="172" class="s" text-anchor="start">前半的页只能进前半, 后半同理</text><text x="296" y="192" class="s" text-anchor="start">组里 4 路满了, 踢掉的是整个 32KB</text><text x="296" y="212" class="s pk" text-anchor="start">同一块的邻居互相挤, 越连续越慢</text></g></svg>